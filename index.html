<style>
@font-face{font-family:Pretendard;font-weight:400;font-display:swap;src:url(fonts/Pretendard-Regular.subset.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:700;font-display:swap;src:url(fonts/Pretendard-Bold.subset.woff2) format("woff2")}
:root{--navy:#16264F;--navy2:#24386B;--sky:#A9CCE8;--sky2:#E8F1F9;--sand:#E9C88E;--ink:#1B2236;--ink2:#4A5468;--line:#DCE2EC;--bg:#F4F6FA;--ok:#1D7A4E;--no:#B23B3B}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'맑은 고딕','Malgun Gothic',-apple-system,sans-serif;font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
.top{background:var(--navy);color:#fff;padding:22px 0 26px}
.top .wrap{padding-bottom:0}
.top .org{font-size:13px;opacity:.75;letter-spacing:.02em}
.top h1{margin:4px 0 0;font-size:23px;line-height:1.3;font-weight:700}
.top .sub{margin-top:6px;font-size:14px;opacity:.85}
.bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;text-decoration:none}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.card h2{margin:0 0 10px;font-size:18px}
.card h3{margin:16px 0 8px;font-size:15px}
.muted{color:var(--ink2);font-size:14px}
.stmt{background:var(--sky2);border-radius:10px;padding:12px 14px;font-size:15px}
.cnt{display:flex;align-items:baseline;gap:6px;margin-top:12px}
.cnt b{font-size:28px;color:var(--navy)}
.prog{height:8px;background:#E6EBF3;border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--navy);width:0}
label.f{display:block;margin-top:12px;font-size:14px;font-weight:600}
input.t,select.t{display:block;width:100%;margin-top:6px;padding:12px 12px;border:1px solid #C9D1DE;border-radius:10px;background:#fff;font-size:16px}
input.t:focus,select.t:focus{outline:2px solid var(--sky);border-color:var(--navy)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dongs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.dongs button{padding:12px 0;border:1px solid #C9D1DE;border-radius:10px;background:#fff;font-weight:700}
.dongs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:17px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{display:inline-block;width:auto;margin:0;padding:8px 14px;font-size:14px;border-radius:9px}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.choice{display:grid;gap:10px;margin-top:8px}
.choice button{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border:1.5px solid #C9D1DE;border-radius:12px;background:#fff;font-size:16px;cursor:pointer}
.choice button .bx{flex:none;width:22px;height:22px;border:2px solid #8C97AB;border-radius:4px;position:relative}
.choice button.on{border-color:var(--navy);background:var(--sky2)}
.choice button.on .bx{border-color:var(--navy);background:var(--navy)}
.choice button.on .bx::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.tog{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600;cursor:pointer}
.tog input{width:20px;height:20px}
.pv{font-size:13px;color:var(--ink2);background:#F7F8FB;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.pv b{color:var(--ink)}
.err{color:var(--no);font-size:14px;margin-top:8px;min-height:1em}
.pad{position:relative;margin-top:8px;border:1.5px dashed #9AA6BB;border-radius:12px;background:#fff;touch-action:none;height:180px}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px}
.pad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#A3ACBD;pointer-events:none;font-size:15px}
.pad .clr{position:absolute;right:8px;top:8px;z-index:2}
.steps{display:flex;gap:6px;margin:16px 0 0}
.steps i{flex:1;height:4px;border-radius:9px;background:#D5DCE7}
.steps i.on{background:var(--navy)}
.hide{display:none!important}
.deedbox{margin-top:12px;background:#E9EDF3;border-radius:10px;padding:8px;overflow:hidden}
.deedbox .dz{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);margin:0 auto;width:210mm}
.done{text-align:center}
.done .ic{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;line-height:56px;margin:4px auto 8px}
.foot{text-align:center;color:#8A93A5;font-size:12px;margin-top:22px}
.flow{list-style:none;margin:6px 0 0;padding:0;position:relative}
.flow li{position:relative;display:flex;gap:12px;padding:0 0 14px}
.flow li:last-child{padding-bottom:0}
.flow li::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:#D5DCE7}
.flow li:last-child::before{display:none}
.flow .n{flex:none;width:32px;height:32px;border-radius:50%;background:#E6EBF3;color:var(--ink2);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;z-index:1}
.flow .tx b{display:block;font-size:15px}
.flow .tx span{display:block;font-size:13px;color:var(--ink2)}
.flow li.now .n{background:var(--navy);color:#fff;box-shadow:0 0 0 5px var(--sky2)}
.flow li.now .tx b{color:var(--navy)}
.flow .now-t{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--sand);color:#5A3E0E;font-size:11px;font-weight:700;vertical-align:2px}
/* 관리자 */
.adm .wrap{max-width:1080px}
table.l{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.l th,table.l td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;white-space:nowrap}
table.l th{background:#F2F5FA;font-size:13px;color:var(--ink2);position:sticky;top:0}
table.l tr.v td{color:#A0A7B4;text-decoration:line-through}
table.l tr.dup td{color:#8A93A5}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.tag.a{background:#E2F3EA;color:var(--ok)}.tag.d{background:#F8E5E5;color:var(--no)}.tag.g{background:#ECEFF4;color:#6A7385}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{display:block;color:var(--ink2);font-size:12px}.kpi b{font-size:22px}
.flt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.flt select,.flt input{padding:8px 10px;border:1px solid #C9D1DE;border-radius:9px;background:#fff;font-size:14px}
.miss{font-size:13px;color:var(--ink2);line-height:1.8;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:50;display:flex;flex-direction:column}
.modal .mh{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;background:#fff}
.modal .mb{flex:1;overflow:auto;padding:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.rv-t{width:100%;border-collapse:collapse;font-size:15px}.rv-t th{width:74px;text-align:left;vertical-align:top;padding:8px 8px 8px 0;color:var(--ink2);font-weight:600;white-space:nowrap}.rv-t td{padding:8px 0;border-bottom:1px solid var(--line)}.rv-t tr:last-child td{border-bottom:0}
.rv-ul{margin:0;padding-left:18px;line-height:1.7}
.rsvp-cta{border:1.5px solid var(--navy)}.rsvp-cta .btn{margin-top:12px}
/* ── 인트로 (법무법인 제이엘 플랫폼 공통) ── */
:root{--ease:cubic-bezier(.22,1,.36,1)}
.intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#070b14;color:#fff;overflow:hidden}
.intro.gone{display:none}
.intro-bg{position:absolute;inset:0;background:radial-gradient(58% 42% at 50% 40%,rgba(92,130,255,.28),transparent 70%),radial-gradient(45% 40% at 80% 80%,rgba(169,204,232,.18),transparent 70%),linear-gradient(160deg,#070b14,#0d1530);transform:scale(1.08);animation:introBg 5s var(--ease) forwards}
@keyframes introBg{to{transform:scale(1)}}
.intro-in{position:relative;text-align:center;padding:0 26px;max-width:460px}
.intro-logo{position:relative;display:inline-block;overflow:hidden;opacity:0;animation:logoIn 1.15s var(--ease) .2s forwards}
.intro-logo img{display:block;width:230px;max-width:62vw;height:auto}
@keyframes logoIn{from{opacity:0;transform:scale(.9) translateY(10px);filter:blur(9px)}to{opacity:1;transform:none;filter:blur(0)}}
.intro-logo .shine{position:absolute;top:-30%;bottom:-30%;width:42%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:1.25s cubic-bezier(.5,0,.3,1) 1.1s forwards shine}
@keyframes shine{to{left:130%}}
.intro-rule{width:0;height:1px;margin:24px auto 20px;background:linear-gradient(90deg,transparent,rgba(143,168,255,.85),transparent);animation:rule .9s var(--ease) 1.55s forwards}
@keyframes rule{to{width:200px}}
.intro-apt{font-size:1.52rem;font-weight:700;letter-spacing:.3em;opacity:0;animation:introTx 1.35s var(--ease) 1.8s forwards;text-indent:.3em}
.intro-org{font-size:.84rem;color:#93a4c4;letter-spacing:.2em;margin-top:10px;opacity:0;animation:introTx 1.15s var(--ease) 2.25s forwards;text-indent:.2em}
@keyframes introTx{from{opacity:0;letter-spacing:.6em;filter:blur(7px);transform:translateY(9px)}to{opacity:1;letter-spacing:.22em;filter:blur(0);transform:none}}
.intro-by{font-size:.76rem;color:#5e6e8a;letter-spacing:.16em;margin-top:26px;opacity:0;animation:byIn .9s var(--ease) 2.75s forwards}
@keyframes byIn{to{opacity:1}}
.intro-skip{font-size:.76rem;color:#3e4a62;letter-spacing:.1em;margin-top:34px;opacity:0;animation:byIn 1s var(--ease) 3.3s forwards}
.intro.out .intro-in{animation:introOut .55s var(--ease) 4.5s forwards}
@keyframes introOut{to{opacity:0;transform:translateY(-14px) scale(.975);filter:blur(4px)}}
.intro.out{animation:1s cubic-bezier(.76,0,.24,1) 4.8s forwards curtain}
@keyframes curtain{to{transform:translateY(-101%)}}
body.booting{overflow:hidden}
body.booting #app{opacity:0;transform:translateY(16px)}
body.booted #app{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .8s var(--ease)}
@media (prefers-reduced-motion:reduce){.intro{display:none}}
/* ── 앱 설치 (홈 화면에 추가) ── */
.chip.ins{background:#fff;color:var(--navy);border-color:#fff;font-weight:700;cursor:pointer}
@media (display-mode:standalone){.chip.ins{display:none!important}}
.install{position:fixed;left:12px;right:12px;z-index:70;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;box-shadow:0 2px 4px rgba(11,18,32,.05),0 18px 48px rgba(11,18,32,.16)}
.ins-ic{width:42px;height:42px;border-radius:12px;flex:none}
.ins-tx{flex:1;min-width:0}.ins-tx b{display:block;font-size:15px}.ins-tx span{display:block;font-size:13px;color:var(--ink2);line-height:1.5;margin-top:2px}
.ins-btns{display:flex;align-items:center;gap:4px;flex:none}
.ins-x{width:30px;height:30px;border:0;background:none;border-radius:9px;color:#8A93A5;font-size:15px;cursor:pointer}
@media(min-width:960px){.install{left:auto;right:24px;bottom:24px;max-width:400px}}
.inapp-bar{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:90;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:#191919;color:#fff;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.inapp-bar span{flex:1}
.inapp-bar button{border:0;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;background:#fee500;color:#111;cursor:pointer}
.inapp-bar button.x{background:0 0;color:#fff;padding:6px}
body.has-inapp .wrap{padding-bottom:90px}
.sheet{position:fixed;inset:0;z-index:120;background:rgba(10,16,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .sh{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:18px}
.ins-how .ins-b{font-weight:700;margin-bottom:8px}
.ins-how ol{margin:0 0 12px;padding-left:22px;line-height:1.9;font-size:15px}
.ins-how p{font-size:13px;color:#6A7385;line-height:1.7;margin:10px 0 0}
/* ── 동의서 양식 (HWP 원본 좌표 그대로 · mm) ── */
.pg{position:relative;width:210mm;height:297mm;background:#fff;color:#000;overflow:hidden;line-height:1.2;text-align:left;
 font-family:Pretendard,'맑은 고딕','Malgun Gothic',sans-serif;font-size:11pt;word-break:keep-all;letter-spacing:.07em;word-spacing:.1em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg *{box-sizing:border-box;margin:0;padding:0}
.pg .ab{position:absolute}
.pg .t,.pg .f{left:30mm;width:150mm;text-align:center;font-size:15pt;font-weight:700;line-height:1;letter-spacing:.15em;word-spacing:.15em}
.pg table{position:absolute;left:30.7mm;width:148mm;border-collapse:collapse;table-layout:fixed}
.pg td{border:.12mm solid #000;text-align:center;vertical-align:middle;font-size:11pt;line-height:1.2;padding:.5mm 1.8mm;overflow:hidden;white-space:nowrap}
.pg .ti td{height:9.6mm}.pg .tj td{height:9.1mm}
.pg td.h{background:#d9d9d9}
.pg .tk td{font-size:13pt}
.pg .tk tr.r0 td{height:14.65mm;background:#fff7cc}
.pg .tk tr.r1 td{height:33.2mm}

.pg .tk td.l{text-align:left}
.pg .tk .cb{display:block;height:5.4mm;line-height:5.4mm}
.pg .tk .ct{display:block;font-size:10pt;line-height:1.3}
.pg .bx{display:inline-block;width:3.4mm;height:3.4mm;border:.25mm solid #000;vertical-align:middle;position:relative}
.pg .bx.on::after{content:"";position:absolute;left:.9mm;top:-.2mm;width:1.1mm;height:2.2mm;border:solid #000;border-width:0 .5mm .5mm 0;transform:rotate(45deg)}
.pg .p{left:30mm;width:150mm;font-size:11pt;line-height:6.2mm;text-align:justify;letter-spacing:.08em;word-spacing:.05em}
.pg .d{left:30mm;width:150mm;text-align:center;font-size:12pt;line-height:1}
.pg .s{left:30mm;width:150mm;height:6mm;font-size:12pt;line-height:6mm}
.pg .s .k{position:absolute;right:56.5mm;white-space:pre}
.pg .s .v{position:absolute;left:94.5mm;width:26mm;text-align:left;white-space:nowrap;overflow:hidden}
.pg .s .v.sm{font-size:10pt}.pg .s .v.xs{font-size:8pt}
/* 서명은 「(서명 또는 날인)」 자리에 — 계약자 줄은 위로, 공동명의 줄은 아래로만 커져서 두 서명이 겹치지 않음 */
.pg .s .w{position:absolute;left:120.5mm;width:29mm;height:10mm;display:flex;justify-content:center;pointer-events:none}
.pg .s1 .w{bottom:-.3mm;align-items:flex-end}
.pg .s2 .w{top:-.1mm;align-items:flex-start}
.pg .s .n{position:absolute;right:3.3mm;font-size:9pt}
.pg .sg{display:block;max-height:10mm;max-width:29mm;width:auto;height:auto;mix-blend-mode:multiply}

#prt{display:none}
@media print{
 @page{size:A4;margin:0}
 html,body{background:#fff!important}
 body>*:not(#prt){display:none!important}
 .intro,.install,.inapp-bar,.sheet{display:none!important}
 #prt{display:block!important}
 #prt .pg{zoom:1!important;page-break-after:always;break-after:page}
 #prt .pg:last-child{page-break-after:auto;break-after:auto}
}
</style>

  h(head()+'<div class="wrap">'+
  '<div class="kpis" style="margin-top:14px"><div class="kpi"><small>신청 세대</small><b>'+s.n+'</b></div><div class="kpi"><small>참석 예정 인원</small><b style="color:var(--navy)">'+s.people+'명</b></div>'+
  '<div class="kpi"><small>세대당 평균</small><b>'+(s.n?(s.people/s.n).toFixed(1):'0')+'명</b></div><div class="kpi"><small>총 세대</small><b>'+C.total+'</b></div></div>'+
  '<div class="card"><h2>동별 신청</h2><div class="scroll" style="max-height:none"><table class="l"><tr><th>동</th><th>세대</th><th>신청 세대</th><th>참석 인원</th></tr>'+
  dongs.map(function(d){var b=s.byDong[d]||{n:0,p:0};return'<tr><td>'+d+'동</td><td>'+hos(d).length+'</td><td>'+b.n+'</td><td>'+b.p+'명</td></tr>'}).join('')+'</table></div></div>'+
  '<div class="card"><h2>신청 목록</h2><div class="flt">'+
  '<select id="fd"><option value="">전체 동</option>'+dongs.map(function(d){return'<option'+(f.dong===d?' selected':'')+' value="'+d+'">'+d+'동</option>'}).join('')+'</select>'+
  '<input id="fq" placeholder="이름 · 호수 · 연락처" value="'+esc(f.q)+'"><label class="muted"><input type="checkbox" id="fv"'+(f.voids?' checked':'')+'> 무효 포함</label>'+
  '<span style="flex:1"></span><button class="btn ghost sm" id="rf">새로고침</button><button class="btn sm" id="csv">엑셀(CSV)</button></div><div id="tb"></div></div>'+foot()+'</div>');
  $('#fd').onchange=function(){f.dong=this.value;rvTable()};$('#fq').oninput=function(){f.q=this.value;rvTable()};$('#fv').onchange=function(){f.voids=this.checked;rvTable()};
  $('#rf').onclick=function(){this.disabled=true;rvLoad()};$('#csv').onclick=rvCsv;
  rvTable();
}
function rvTable(){
  var r=rvRows();
  $('#tb').innerHTML='<p class="muted" style="margin:8px 0 0">'+r.length+'건</p><div class="scroll"><table class="l"><tr><th>접수</th><th>동호수</th><th>이름</th><th>연락처</th><th>인원</th><th>신청일시</th><th>상태</th><th></th></tr>'+
  r.map(function(x){return'<tr class="'+(x.void?'v':x.dup?'dup':'')+'"><td>'+x.no+'</td><td>'+esc(x.dong+'동 '+x.ho+'호')+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.count)+'명</td><td>'+esc(x.at)+'</td><td>'+
    (x.cancel?'<span class="tag d">본인 취소</span>':x.changed?'<span class="tag g">변경 전</span>':x.void?'<span class="tag g">무효</span>':x.dup?'<span class="tag g">이전 신청</span>':'<span class="tag a">유효</span>')+'</td><td>'+
    (x.void?'<button class="btn ghost sm" data-r="'+x.no+'">되살리기</button>':'<button class="btn ghost sm" data-x="'+x.no+'">무효</button>')+'</td></tr>'}).join('')+'</table></div>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-x]'),function(b){b.onclick=function(){rvVoid(+b.getAttribute('data-x'),'void')}});
  Array.prototype.forEach.call(document.querySelectorAll('[data-r]'),function(b){b.onclick=function(){rvVoid(+b.getAttribute('data-r'),'restore')}});
}
function rvVoid(n,op){
  var r=RA.list.filter(function(x){return x.no===n})[0];if(!r)return;
  var memo=prompt((op==='void'?'무효 처리':'되살리기')+' — '+r.dong+'동 '+r.ho+'호 '+r.name+'\n사유를 적어 주세요 (기록에 남습니다)','');if(memo===null)return;
  post('/admin',{pin:RA.pin,op:op,no:n,memo:memo}).then(function(j){if(!j.ok)return alert(j.message);rvLoad()});
}
function rvCsv(){
  var r=rvRows().slice().sort(function(a,c){return a.dong-c.dong||a.ho-c.ho||a.no-c.no});
  var q=function(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
  var lines=[['접수번호','동','호','이름','연락처','참석 인원','신청일시','상태'].map(q).join(',')].concat(r.map(function(x){return[x.no,x.dong,x.ho,x.name,x.phone,x.count,x.at,x.cancel?'본인 취소':x.changed?'변경 전':x.void?'무효':x.dup?'이전 신청':'유효'].map(q).join(',')}));
  var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='총회참석신청_'+C.short+'_'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}
if(C.page==='rsvp'){if(C.mode==='admin')rvLogin();else rvForm()}
else if(C.mode==='admin')login();else intro();
splash();
})();
</script>
</body>
</html>
