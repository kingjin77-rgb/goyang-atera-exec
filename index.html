function table(){
  var r=rows();
  $('#tb').innerHTML='<p class="muted" style="margin:8px 0 0">'+r.length+'건'+(A.f.dong?'':' · 인쇄는 동을 골라 한 동씩 하는 것을 권합니다')+'</p><div class="scroll"><table class="l"><tr><th>접수</th><th>동호수</th><th>계약자</th><th>생년월일</th><th>연락처</th><th>공동명의</th><th>동의</th><th>제출일시</th><th></th></tr>'+
  r.map(function(x){return'<tr class="'+(x.void?'v':x.dup?'dup':'')+'"><td>'+x.no+'</td><td>'+esc(x.dong+'동 '+x.ho+'호')+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.birth)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.joint?x.joint.name:'')+'</td><td>'+
   (x.void?'<span class="tag g">무효</span>':x.dup?'<span class="tag g">이전 제출</span>':x.agree?'<span class="tag a">동의</span>':'<span class="tag d">부동의</span>')+'</td><td>'+esc(x.at)+'</td><td><button class="btn ghost sm" data-v="'+x.no+'">보기</button> '+
   (x.void?'<button class="btn ghost sm" data-r="'+x.no+'">되살리기</button>':'<button class="btn ghost sm" data-x="'+x.no+'">무효</button>')+'</td></tr>'}).join('')+'</table></div>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-v]'),function(b){b.onclick=function(){view(+b.getAttribute('data-v'))}});
  Array.prototype.forEach.call(document.querySelectorAll('[data-x]'),function(b){b.onclick=function(){setVoid(+b.getAttribute('data-x'),'void')}});
  Array.prototype.forEach.call(document.querySelectorAll('[data-r]'),function(b){b.onclick=function(){setVoid(+b.getAttribute('data-r'),'restore')}});
  /* 미제출 호수 (동 고르면) */
  var ms=$('#ms');if(!A.f.dong){ms.innerHTML='';return}
  var got={};A.list.forEach(function(x){if(!x.void&&x.dong===A.f.dong)got[x.ho]=1});
  var miss=hos(A.f.dong).filter(function(x){return!got[x]});
  ms.innerHTML='<h3>'+A.f.dong+'동 미제출 '+miss.length+'세대</h3><div class="miss">'+miss.join(' · ')+'</div>';
}
function byNo(n){for(var i=0;i<A.list.length;i++)if(A.list[i].no===n)return A.list[i]}
function sigOf(file){if(!file)return Promise.resolve('');if(SIG[file])return Promise.resolve(SIG[file]);
  return post('/admin',{pin:A.pin,op:'sig',file:file}).then(function(j){if(!j.ok)return'';return SIG[file]='data:image/png;base64,'+j.b64})}
function withSig(r){return Promise.all([sigOf(r.sig),sigOf(r.jsig)]).then(function(s){var v={};for(var k in r)v[k]=r[k];v.sigUrl=s[0];v.jsigUrl=s[1];return v})}
function view(n){
  var r=byNo(n);if(!r)return;
  var m=document.createElement('div');m.className='modal';m.innerHTML='<div class="mh"><span class="muted" style="margin-right:auto">'+esc(r.dong+'동 '+r.ho+'호 · '+r.name+' · 접수 '+r.no)+'</span><button class="btn sm" id="mp" disabled>인쇄</button><button class="btn ghost sm" id="mc">닫기</button></div><div class="mb"><div class="deedbox"><div class="dz"><p class="muted" style="padding:20px">서명 불러오는 중…</p></div></div></div>';
  document.body.appendChild(m);$('#mc',m).onclick=function(){m.remove()};
  withSig(r).then(function(v){$('.dz',m).innerHTML=deed(v);fit($('.deedbox',m));var b=$('#mp',m);b.disabled=false;b.onclick=function(){printDeeds([v])}});
}
function setVoid(n,op){
  var r=byNo(n);if(!r)return;var memo=prompt((op==='void'?'무효 처리':'되살리기')+' — '+r.dong+'동 '+r.ho+'호 '+r.name+'\n사유를 적어 주세요 (기록에 남습니다)','');if(memo===null)return;
  post('/admin',{pin:A.pin,op:op,no:n,memo:memo}).then(function(j){if(!j.ok)return alert(j.message);load()});
}
function printList(){
  var r=rows().filter(function(x){return!x.void&&!x.dup});if(!r.length)return alert('인쇄할 동의서가 없습니다');
  if(r.length>150&&!confirm(r.length+'장입니다. 서명을 불러오는 데 시간이 걸립니다. 계속할까요?'))return;
  var b=$('#pa'),i=0,out=new Array(r.length),busy=0;b.disabled=true;
  r.sort(function(a,c){return a.dong-c.dong||a.ho-c.ho});
  function next(){if(i>=r.length){if(!busy){b.disabled=false;b.textContent='목록 동의서 인쇄';printDeeds(out)}return}
    var k=i++;busy++;withSig(r[k]).then(function(v){out[k]=v;busy--;b.textContent='준비 중 '+(r.length-i+busy>0?i:r.length)+'/'+r.length;next()})}
  for(var t=0;t<4;t++)next();
}
function csv(){
  var r=rows().slice().sort(function(a,c){return a.dong-c.dong||a.ho-c.ho||a.no-c.no});
  var head=['접수번호','동','호','계약자','생년월일','연락처','공동명의','공동 생년월일','공동 연락처','동의여부','제출일시','상태'];
  var q=function(s){s=String(s==null?'':s);if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};
  var lines=[head.map(q).join(',')].concat(r.map(function(x){var j=x.joint||{};return[x.no,x.dong,x.ho,x.name,x.birth,x.phone,j.name,j.birth,j.phone,x.agree?'동의':'부동의',x.at,x.void?'무효':x.dup?'이전 제출':'유효'].map(q).join(',')}));
  var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='명칭변경동의_'+C.short+'_'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

if(C.mode==='admin')login();else intro();
})();
</script>
</body>
